[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["artifacts", "data", ".venv", "venv", "pricing_app", "pricin_app", "**/site-packages/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
