name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: house-pricing-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run ruff (lint)
        run: ruff check .
      - name: Run ruff (format check)
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Generate dataset and train model (needed for tests + image)
        run: |
          python data/generate_synthetic_data.py
          python src/train.py
      - name: Run tests
        run: pytest tests/ -v
      - name: Upload trained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Download trained artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Save image as tarball
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load -i image.tar
      - name: Run container
        run: |
          docker run -d --name smoke-test -p 8000:8000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Wait for health check
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Servicio saludable"
              exit 0
            fi
            echo "Esperando servicio... intento $i"
            sleep 2
          done
          echo "El servicio no respondió a tiempo"
          docker logs smoke-test
          exit 1
      - name: Call /predict for real
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"overall_qual":7,"gr_liv_area":1710,"total_bsmt_sf":856,"garage_cars":2,"full_bath":2,"year_built":2003}' \
            | tee /tmp/predict_response.json
          grep -q "predicted_price" /tmp/predict_response.json
      - name: Dump container logs on failure
        if: failure()
        run: docker logs smoke-test
      - name: Stop container
        if: always()
        run: docker rm -f smoke-test || true

  publish:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download trained artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
