services:
  house-pricing-api:
    build: .
    image: house-pricing-api:local
    container_name: house-pricing-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ARTIFACTS_DIR=artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
